[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.6"
edition = "2021"
license = "MIT"
repository = "https://github.com/mlm-games/reassarus"
rust-version = "1.98"

[workspace.dependencies]
# Internal crates
reassarus-core = { path = "crates/reassarus-core", version = "0.1.6" }
reassarus-editor = { path = "crates/reassarus-editor", version = "0.1.6" }
reassarus-renderer = { path = "crates/reassarus-renderer", version = "0.1.6" }

# Shared core deps
thiserror = "2"
ahash = { version = "0.8", default-features = false, features = ["std"] }
bitflags = "2"
hashbrown = { version = "0.17" }
bumpalo = "3"
wide = "1"
unicode-linebreak = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
criterion = { version = "0.8", features = ["html_reports"] }

# Editor deps
ropey = { version = "1.6", default-features = false }
fst = "0.4"
parking_lot = "0.12"
futures = "0.3"
tokio = { version = "1", features = ["sync"] }
regex = "1"
static_assertions = "1"
getrandom = "0.4"
tempfile = "3"
pretty_assertions = "1"
proptest = "1"

# Renderer deps
rustybuzz = "0.20"
tiny-skia = "0.12"
fontdb = "0.24"
ttf-parser = "0.25"
rayon = "1"
repose-core = "0.30"
repose-text = "0.30"
# default-features off (see below) but the wasm Send/Sync shim back on:
# without `fragile-send-sync-non-atomic-wasm`, single-threaded wasm32 makes
# wgpu handles !Send+!Sync and `ReposeBackend: Send+Sync` fails (E0277).
repose-render-wgpu = { version = "0.30", default-features = false, features = [
    "fragile-send-sync-non-atomic-wasm",
] }
lyon_path = "1.0"
lyon_tessellation = "1.0"
smallvec = "1"
image = "0.25"
env_logger = "0.11"
vcpkg = "0.2"
pkg-config = "0.3"

[workspace.lints.clippy]
# Allow negative feature names as they are required for nostd compatibility
# This lint conflicts with the project's architectural requirement for nostd support
negative_feature_names = "allow"

[workspace.lints.rust]
# Standard Rust lints
unused_variables = "warn"
dead_code = "warn"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false

[profile.dev]
opt-level = 1
